[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "frappe-crm-mcp"
version = "0.1.0"
description = "Sales pipelines, deal management, lead scoring, and automated communications."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Albanna Software Solutions", email = "ahmedalbanna966@gmail.com" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["frappe_crm_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../albanna-ai-chat"]
addopts = "-q"
